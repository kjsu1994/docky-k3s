apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: prepare-shared-paths
          image: docky/backend:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/csv_data /data/streaming
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: backend
          image: docky/backend:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docky-app-config
            - secretRef:
                name: docky-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data/csv_data
              subPath: csv_data
              readOnly: true
            - name: minio-data
              mountPath: /data/streaming
              subPath: streaming
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
