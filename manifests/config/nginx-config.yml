apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

        limit_req_status 429;
        limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
        limit_req_zone $binary_remote_addr zone=api_auth:10m rate=30r/m;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" close;
        }

        map $http_x_forwarded_proto $client_proto {
            default $scheme;
            https https;
            http http;
        }

        upstream spring_backend {
            server backend:8080 max_fails=3 fail_timeout=5s;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            client_max_body_size 3G;
            root /usr/share/nginx/client/current;
            index index.html;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self), fullscreen=(self)" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

            location ^~ /api/admin/streaming/videos {
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://spring_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location = /api/streaming/videos {
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://spring_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location ^~ /api/streaming/videos/ {
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://spring_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location ^~ /upload-files/ {
                proxy_pass http://minio:9000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location ~ ^/api/(members/login|members/email-verification/(send|confirm)|members/account-recovery/|oauth2/authorization/) {
                limit_req zone=api_auth burst=20 nodelay;
                proxy_pass http://spring_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location /api/ {
                limit_req zone=api_general burst=120 nodelay;
                proxy_pass http://spring_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location /ws/ {
                proxy_pass http://spring_backend;
                proxy_http_version 1.1;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }

            location /login/oauth2/code/ {
                proxy_pass http://spring_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $client_proto;
            }


            location = /sw.js {
                try_files $uri =404;
                add_header Cache-Control "no-cache, must-revalidate" always;
            }

            location ~* \.(?:avif|bmp|gif|ico|jpe?g|png|svg|webp)$ {
                try_files $uri =404;
                add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800" always;
            }

            location ~* \.m?js$ {
                try_files $uri =404;
                add_header Cache-Control "no-cache, must-revalidate" always;
            }

            location ^~ /assets/ {
                try_files $uri =404;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }

            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            }

            location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            }
        }
    }
