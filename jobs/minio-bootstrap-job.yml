apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: docky
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: docky-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docky-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              until mc alias set docky http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 5
              done
              mc mb --ignore-existing docky/upload-files
              mc mb --ignore-existing docky/client
              mc anonymous set download docky/upload-files || true
